<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Silvet</title>

<style>

/* BASE */
body {
    margin: 0;
    font-family: Arial;
    background: #ffffff;
}

/* NAV (BRIGHTER + CLEANER) */
nav {
    background: linear-gradient(90deg, #000000, #1a1a1a);
    padding: 15px;
    position: fixed;
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: white;
    z-index: 1000;
}

nav a {
    color: #ffffff;
    margin: 10px;
    text-decoration: none;
}

/* CART (MADE MORE VISIBLE) */
.cart-btn {
    background: #ffcc00;
    color: black;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* HERO (BRIGHTER SILVET FEEL) */
.hero {
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb") center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 2px 2px 10px black;
}

/* SECTION */
section {
    padding: 70px 20px;
    text-align: center;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

/* CARD (FIXED SIZE = NO ZOOM ISSUES) */
.card {
    width: 220px;
    margin: 12px;
    border-radius: 10px;
    overflow: hidden;
    background: #f5f5f5;
    transition: 0.25s;
}

.card:hover {
    transform: scale(1.04);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* CART BOX (BETTER LOOK) */
#cartBox {
    display: none;
    position: fixed;
    top: 80px;
    right: 20px;
    background: white;
    padding: 15px;
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
    border-radius: 10px;
    width: 200px;
}

/* COLORS */
#hoodies { background: #f3f3f3; }
#tshirts { background: #fff0f5; }
#caps { background: #eaffea; }

/* GALLERY (SMALL + CLEAN FIX) */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    padding: 10px;
}

.gallery img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
}

/* FOOTER */
footer {
    background: black;
    color: white;
    padding: 20px;
    text-align: center;
    margin-top: 40px;
}

</style>
</head>

<body>
