<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvet</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">SILVET</div>

  <div class="cart-btn" onclick="toggleCart()">
    🛒 Cart (<span id="count">0</span>)
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h1 class="logoAnim">SILVET</h1>
  <p>Fashion × Nature × Energy</p>
</div>

<!-- SHOP -->
<section>
<h2>Shop</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38?auto=format&fit=crop&w=600&q=60">
<h3>Urban Hoodie</h3>
<p>$45</p>
<button onclick="add('Urban Hoodie')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?auto=format&fit=crop&w=600&q=60">
<h3>Street Style Tee</h3>
<p>$25</p>
<button onclick="add('Street Tee')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=600&q=60">
<h3>Premium Jacket</h3>
<p>$70</p>
<button onclick="add('Jacket')">Add</button>
</div>

</div>
</section>

<!-- GALLERY (SCENERY + LIFESTYLE ONLY) -->
<section>
<h2>Gallery</h2>

<div class="gallery">

<!-- mountains -->
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=60">

<!-- sunset -->
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=60">

<!-- forest -->
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=600&q=60">

<!-- waterfall -->
<img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=600&q=60">

<!-- car -->
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=60">

<!-- bike -->
<img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?auto=format&fit=crop&w=600&q=60">

<!-- road scenery -->
<img src="https://images.unsplash.com/photo-1501769214405-5e86d9b6e5d7?auto=format&fit=crop&w=600&q=60">

<!-- ocean -->
<img src="https://images.unsplash.com/photo-1505142468610-359e7d316be0?auto=format&fit=crop&w=600&q=60">

</div>
</section>

<!-- CART -->
<div id="cart">
  <h3>Cart</h3>
  <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
