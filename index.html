<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Silvet Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<header>
  <div class="logo">SILVET</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#men">Men</a>
    <a href="#women">Women</a>
    <a href="#gallery">Gallery</a>
  </nav>

  <div class="cart" onclick="toggleCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </div>
</header>

<!-- HERO -->
<section id="home" class="hero">
  <h1>Modern Fashion Store</h1>
  <p>Style that moves with energy ⚡</p>
</section>

<!-- MEN -->
<section id="men">
<h2>Men Collection</h2>

<div class="grid">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
    <h3>Black Hoodie</h3>
    <button onclick="addToCart('Black Hoodie')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
    <h3>Street T-Shirt</h3>
    <button onclick="addToCart('Street T-Shirt')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf">
    <h3>Casual Jacket</h3>
    <button onclick="addToCart('Casual Jacket')">Add to Cart</button>
  </div>
</div>
</section>

<!-- WOMEN -->
<section id="women">
<h2>Women Collection</h2>

<div class="grid">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1520975682031-a7e3a6c8fdf9">
    <h3>Elegant Dress</h3>
    <button onclick="addToCart('Elegant Dress')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1520974735194-6d3a8c9d7c9b">
    <h3>Casual Wear</h3>
    <button onclick="addToCart('Casual Wear')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb">
    <h3>Summer Outfit</h3>
    <button onclick="addToCart('Summer Outfit')">Add to Cart</button>
  </div>
</div>
</section>

<!-- GALLERY (15 IMAGES) -->
<section id="gallery">
<h2>Fashion Gallery</h2>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1520975682031-a7e3a6c8fdf9">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
<img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb">
<img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf">
<img src="https://images.unsplash.com/photo-1520974735194-6d3a8c9d7c9b">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b">
<img src="https://images.unsplash.com/photo-1483118714900-540cf339fd46">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
<img src="https://images.unsplash.com/photo-1521334884684-d80222895322">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
<img src="https://images.unsplash.com/photo-1520975958221-8f6a7d2b5d7c">
<img src="https://images.unsplash.com/photo-1514996937319-344454492b37">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b">
<img src="https://images.unsplash.com/photo-1520975682031-a7e3a6c8fdf9">

</div>
</section>

<!-- CART -->
<div id="cartBox">
  <h3>Your Cart</h3>
  <ul id="cartItems"></ul>
  <button onclick="clearCart()">Clear Cart</button>
</div>

<script src="script.js"></script>
</body>
</html>
