<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Silvet</title>

<style>

/* BACKGROUND (NOT WHITE ANYMORE) */
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0f;
    color: white;
}

/* NAV (NEON STYLE) */
nav {
    background: #111;
    padding: 15px;
    position: fixed;
    width: 100%;
    display: flex;
    justify-content: space-between;
    z-index: 1000;
    border-bottom: 2px solid #00ffe5;
}

nav a {
    color: #00ffe5;
    margin: 10px;
    text-decoration: none;
}

/* CART */
.cart-btn {
    background: #ffcc00;
    color: black;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* HERO (COLORFUL GRADIENT) */
.hero {
    height: 100vh;
    background: linear-gradient(135deg, #ff00cc, #3333ff);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* SECTIONS */
section {
    padding: 70px 20px;
    text-align: center;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

/* CARD */
.card {
    width: 210px;
    margin: 12px;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a1a;
    box-shadow: 0 0 10px rgba(0,255,255,0.2);
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

/* CART BOX */
#cartBox {
    display: none;
    position: fixed;
    top: 80px;
    right: 20px;
    background: white;
    color: black;
    padding: 15px;
    border-radius: 10px;
}

/* GALLERY (SMALL + CLEAN) */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
}

.gallery img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 6px;
}

/* FOOTER */
footer {
    background: #111;
    color: #00ffe5;
    text-align: center;
    padding: 20px;
}

</style>
</head>

<body>

<nav>
<div>

<a href="#hoodies">Hoodies</a>
