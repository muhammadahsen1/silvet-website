<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Silvet</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* NAV */
nav {
    background: black;
    padding: 15px;
    position: fixed;
    width: 100%;
    display: flex;
    justify-content: space-between;
    color: white;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
}

/* CART BUTTON */
.cart-btn {
    background: gold;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
}

/* HERO */
.hero {
    height: 100vh;
    background: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb") center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* SECTION */
section {
    padding: 80px 20px;
    text-align: center;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

/* CARD */
.card {
    width: 250px;
    margin: 15px;
    border-radius: 10px;
    overflow: hidden;
    background: #f5f5f5;
    transition: 0.3s;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card:hover {
    transform: scale(1.08);
}

/* CART POPUP */
#cartBox {
    display: none;
    position: fixed;
    top: 80px;
    right: 20px;
    background: white;
    padding: 20px;
    box-shadow: 0 0 10px black;
}

/* COLORS */
#hoodies { background: #eee; }
#tshirts { background: #ffe6f0; }
#caps { background: #e6ffe6; }

/* GALLERY */
.gallery img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    margin: 10px;
}
</style>
</head>

<body>

<nav>
<div>
<a href="#home">Home</a>
<a href="#hoodies">Hoodies</a>
<a href="#tshirts">T-Shirts</a>
<a href="#caps">Caps</a>
</div>

<div class="cart-btn" onclick="toggleCart()">🛒 Cart</div>
</nav>

<!-- HERO -->
<div class="hero" id="home">
<h1>Silvet</h1>
</div>

<!-- HOODIES -->
<section id="hoodies">
<h2>Hoodies ($50)</h2>

<div class="grid">
<div class="card">
<img src="hoodie1.webp">
<p>Classic Hoodie</p>
</div>

<div class="card">
<img src="hoodie2.webp">
<p>Street Hoodie</p>
</div>

<div class="card">
<img src="hoodie3.webp">
<p>Premium Hoodie</p>
</div>
</div>
</section>

<!-- TSHIRTS (FIXED WITH ONLINE IMAGES) -->
<section id="tshirts">
<h2>T-Shirts ($20)</h2>

<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1521335629791-ce4aec67dd47">
<p>Basic Tee</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a">
<p>Stylish Tee</p>
</div>
</div>
</section>

<!-- CAPS (FIXED) -->
<section id="caps">
<h2>Muslim Caps ($15)</h2>

<div class="grid">
<div class="card">
<img src="cap.jpg">
<p>Prayer Cap</p>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1593032465171-8c0c4b1b0e7c">
<p>Premium Cap</p>
</div>
</div>
</section>

<!-- GALLERY -->
<section>
<h2>Gallery</h2>

<div class="gallery">
<img src="hoodie1.webp">
<img src="hoodie2.webp">
<img src="cap.jpg">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
</div>
</section>

<!-- CART BOX -->
<div id="cartBox">
<p>Your cart is empty</p>
</div>

<script>
function toggleCart() {
    let cart = document.getElementById("cartBox");
    cart.style.display = cart.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
