<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvet Store</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">SILVET</div>

  <nav>
    <a href="#men">Men</a>
    <a href="#women">Women</a>
    <a href="#gallery">Gallery</a>
  </nav>

  <div class="cartBtn" onclick="toggleCart()">
    🛒 <span id="cartCount">0</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="heroText">
    <h1>Silvet Fashion</h1>
    <p>Clean style. Modern energy.</p>
  </div>
</section>

<div class="container">

<!-- MEN -->
<section id="men" class="section">
<h2>Men Collection</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
<h3>Hoodie</h3>
<button onclick="addToCart('Hoodie')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
<h3>T-Shirt</h3>
<button onclick="addToCart('T-Shirt')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf">
<h3>Jacket</h3>
<button onclick="addToCart('Jacket')">Add</button>
</div>

</div>
</section>

<!-- WOMEN -->
<section id="women" class="section">
<h2>Women Collection</h2>

<div class="grid">

<div class="card">
<img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb">
<h3>Dress</h3>
<button onclick="addToCart('Dress')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b">
<h3>Outfit</h3>
<button onclick="addToCart('Outfit')">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1520975682031-a7e3a6c8fdf9">
<h3>Style Wear</h3>
<button onclick="addToCart('Style Wear')">Add</button>
</div>

</div>
</section>

<!-- GALLERY -->
<section id="gallery" class="section">
<h2>Gallery</h2>

<div class="gallery">

<!-- fashion -->
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
<img src="https://images.unsplash.com/photo-1503341455253-b2e723bb3dbb">

<!-- bikes -->
<img src="https://images.unsplash.com/photo-1502877338535-766e1452684a">
<img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39">

<!-- cars -->
<img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
<img src="https://images.unsplash.com/photo-1503736334956-4c8f8e92946d">

<!-- scenery -->
<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">

<!-- street fashion -->
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">

</div>
</section>

</div>

<!-- CART -->
<div id="cartBox">
  <h3>Cart</h3>
  <ul id="cartList"></ul>
  <button onclick="clearCart()">Clear</button>
</div>

<script src="script.js"></script>
</body>
</html>
