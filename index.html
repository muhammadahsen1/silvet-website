<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvet</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* NAV */
nav {
    background: black;
    padding: 15px;
    position: fixed;
    width: 100%;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
}

/* HERO */
.hero {
    height: 100vh;
    background: url("t.jpg") center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* SECTION */
section {
    padding: 80px 20px;
    text-align: center;
}

/* GRID */
.grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

/* CARD */
.card {
    width: 250px;
    margin: 15px;
    background: #f5f5f5;
    border-radius: 10px;
    overflow: hidden;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

/* BUTTON */
button {
    padding: 10px;
    border: none;
    background: black;
    color: white;
    width: 100%;
}

/* GALLERY */
.gallery img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    margin: 10px;
}

/* COLORS */
#hoodies { background: #f0f0f0; }
#tshirts { background: #fff0f5; }
#caps { background: #f0fff0; }

footer {
    background: black;
    color: white;
    padding: 20px;
}
</style>
</head>

<body>

<nav>
<a href="#home">Home</a>
<a href="#hoodies">Hoodies</a>
<a href="#tshirts">T-Shirts</a>
<a href="#caps">Caps</a>
<a href="#gallery">Gallery</a>
</nav>

<!-- HERO -->
<div class="hero" id="home">
<h1>Silvet</h1>
</div>

<!-- HOODIES -->
<section id="hoodies">
<h2>Hoodies ($50)</h2>

<div class="grid">
<div class="card">
<img src="hoodie1.webp">
<p>Classic Hoodie</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="hoodie2.webp">
<p>Street Hoodie</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="hoodie3.webp">
<p>Premium Hoodie</p>
<button>Add to Cart</button>
</div>
</div>
</section>

<!-- TSHIRTS -->
<section id="tshirts">
<h2>T-Shirts ($20)</h2>

<div class="grid">
<div class="card">
<img src="t.jpg">
<p>Basic Tee</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="p.jpg">
<p>Stylish Tee</p>
<button>Add to Cart</button>
</div>
</div>
</section>

<!-- CAPS -->
<section id="caps">
<h2>Muslim Caps ($15)</h2>

<div class="grid">
<div class="card">
<img src="cap.jpg">
<p>Prayer Cap</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="cp.jpg">
<p>Premium Cap</p>
<button>Add to Cart</button>
</div>
</div>
</section>

<!-- GALLERY -->
<section id="gallery">
<h2>Gallery</h2>

<div class="gallery">
<img src="hoodie1.webp">
<img src="hoodie2.webp">
<img src="t.jpg">
<img src="cap.jpg">
</div>

</section>

<footer>
<p>© Silvet</p>
</footer>

</body>
</html>
