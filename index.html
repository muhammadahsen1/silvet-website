<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvet | Luxury Fashion</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    scroll-behavior: smooth;
}

/* NAVBAR */
nav {
    position: fixed;
    width: 100%;
    background: linear-gradient(90deg, black, purple);
    padding: 15px;
    z-index: 1000;
}

nav a {
    color: white;
    margin: 0 15px;
    text-decoration: none;
}

/* HERO */
.hero {
    height: 100vh;
    background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb') center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 70px;
}

/* SECTION */
section {
    padding: 80px 20px;
    text-align: center;
}

/* CARDS */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    width: 250px;
    margin: 15px;
    border-radius: 10px;
    overflow: hidden;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
}

.card:hover {
    transform: scale(1.08);
}

/* BUTTON */
button {
    background: black;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* FOOTER */
footer {
    background: black;
    color: white;
    padding: 20px;
}
</style>
</head>

<body>

<nav>
<a href="#home">Home</a>
<a href="#shop">Shop</a>
<a href="#gallery">Gallery</a>
<a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<div class="hero" id="home">
<div>
<h1>Silvet</h1>
<p>Luxury • Streetwear • Tradition</p>
</div>
</div>

<!-- SHOP -->
<section id="shop">
<h2>Shop Collection</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1521335629791-ce4aec67dd47">
<p>T-Shirt - $20</p>
<button onclick="addToCart('T-Shirt')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2">
<p>Hoodie - $50</p>
<button onclick="addToCart('Hoodie')">Add to Cart</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf">
<p>Muslim Cap - $15</p>
<button onclick="addToCart('Cap')">Add to Cart</button>
</div>

</div>

<h3 id="cart">Cart: Empty</h3>
</section>

<!-- GALLERY -->
<section id="gallery">
<h2>Fashion Gallery</h2>

<div class="gallery">
<img src="https://images.unsplash.com/photo-1520975916090-3105956dac38">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
<img src="https://images.unsplash.com/photo-1520975922215-2303f64b4a44">
</div>

</section>

<!-- CONTACT -->
<section id="contact">
<h2>Contact</h2>
<p>Email:</p>
<p><a href="mailto:finetraders@gmail.com">finetraders@gmail.com</a></p>
<p><a href="mailto:SilvetinTrend@gmail.com">SilvetinTrend@gmail.com</a></p>
</section>

<footer>
<p>© Silvet 2026</p>
</footer>

<script>
let cartItems = [];

function addToCart(item) {
    cartItems.push(item);
    document.getElementById("cart").innerText = "Cart: " + cartItems.join(", ");
}
</script>

</body>
</html>
