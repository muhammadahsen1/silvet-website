<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silvet</title>

<style>

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: Arial;
}

/* BACKGROUND (SOOTHING SCENERY) */
.hero {
  height: 100vh;
  width: 100%;
  background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80") center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* DARK OVERLAY FOR CINEMATIC LOOK */
.hero::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right:0;
  bottom:0;
  background: rgba(0,0,0,0.35);
}

/* SILVET LOGO */
.logo {
  font-size: 80px;
  font-weight: bold;
  color: white;
  letter-spacing: 8px;
  z-index: 1;
  animation: dance 3s infinite ease-in-out;
  text-shadow: 0 0 20px rgba(255,255,255,0.6);
}

/* DANCING ANIMATION */
@keyframes dance {
  0%   { transform: translateY(0) scale(1); }
  25%  { transform: translateY(-10px) scale(1.05); }
  50%  { transform: translateY(0) scale(1); }
  75%  { transform: translateY(10px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}

/* SMALL GLOW EFFECT */
.glow {
  position: absolute;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.2);
  filter: blur(80px);
  border-radius: 50%;
  animation: floatGlow 6s infinite ease-in-out;
}

@keyframes floatGlow {
  0% { transform: translate(-100px, -50px); }
  50% { transform: translate(100px, 50px); }
  100% { transform: translate(-100px, -50px); }
}

</style>
</head>

<body>

<div class="hero">

  <div class="glow"></div>

  <div class="logo">SILVET</div>

</div>

</body>
</html>
